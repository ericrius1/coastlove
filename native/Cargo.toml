[package]
name = "coastlove-native"
version = "0.1.0"
edition = "2024"
description = "Native California exploration, built with Rust and wgpu"
license = "MIT"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.33", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
wgpu = { version = "27", default-features = false, features = ["std", "wgsl", "metal", "dx12", "vulkan"] }
glam = { version = "0.30", features = ["bytemuck", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.4"
png = "0.18"
rodio = { version = "0.20", default-features = false }
earcutr = "0.5"

[dev-dependencies]
naga = { version = "27", features = ["wgsl-in"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
